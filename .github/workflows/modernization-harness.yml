name: Modernization harness

on:
  pull_request:
  push:
    branches: ['modernization/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check hook policy, evidence consistency and customization references
        run: python3 -m unittest discover -s tests/guardrails -v
